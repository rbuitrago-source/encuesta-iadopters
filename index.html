<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta reto Máquina de Afiliado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calmado, directo, una pregunta a la vez, sin ruido
   IDEA: formulario conversacional tipo Tally, una tarjeta por pregunta
   PICTURE: la pregunta grande con sus opciones-letra; barra de avance esmeralda
   COLOUR and TYPE: carbón de base, rust solo en botones de acción, esmeralda en datos y avance; Archivo + IBM Plex Sans
   LAYOUT: una columna centrada de 640px, pie fijo con Atrás / Continuar */
:root{color-scheme:light dark;
--bg:light-dark(#f6f5f3,#151617);--card:light-dark(#ffffff,#1f2022);--ink:light-dark(#1c1d1f,#ecebe8);
--muted:light-dark(#5d5f63,#a3a5a9);--line:light-dark(#dcdad6,#34363a);
--rust:#c4532a;--rust-ink:#fff;--emer:light-dark(#0f7a5c,#3fbf93);--emer-soft:light-dark(#e3f2ec,#173a2f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;height:5px;background:var(--line);z-index:2}
.bar i{display:block;height:100%;width:0;background:var(--emer);transition:width .35s ease}
main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:clamp(28px,7vh,72px) max(5vw,18px) 120px}
.step{font:600 13px/1 "IBM Plex Sans",sans-serif;color:var(--emer);margin:0 0 14px}
h1,h2{font-family:Archivo,system-ui,sans-serif;font-weight:800;line-height:1.08;text-wrap:balance;margin:0 0 12px}
h1{font-size:clamp(32px,6vw,46px)}h2{font-size:clamp(25px,4.6vw,34px)}
.help{color:var(--muted);margin:0 0 26px;font-size:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--emer)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--emer);outline-offset:2px}
.opt kbd{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line);border-radius:6px;font:600 13px "IBM Plex Sans",sans-serif;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--emer);background:var(--emer-soft)}
.opt[aria-pressed=true] kbd{background:var(--emer);border-color:var(--emer);color:#fff}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.other{margin-top:10px;display:none}.other.on{display:block}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin-top:12px;min-height:1.4em}
footer{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
.nav{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;padding:12px max(5vw,18px)}
.btn{min-height:46px;padding:0 22px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 16px "IBM Plex Sans",sans-serif;cursor:pointer}
.btn.go{background:var(--rust);border-color:var(--rust);color:var(--rust-ink)}
.btn.go[disabled]{opacity:.4;cursor:not-allowed}
.btn.hide{visibility:hidden}
.hint{font-size:13px;color:var(--muted);align-self:center}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px}
pre{white-space:pre-wrap;font:14px/1.5 "IBM Plex Sans",sans-serif;margin:0;max-height:260px;overflow:auto}
.res h3{font:600 17px "IBM Plex Sans",sans-serif;margin:26px 0 10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;margin:6px 0;font-size:15px}
.track{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:-2px}
.track i{display:block;height:100%;background:var(--emer)}
.row b{text-align:right;color:var(--emer);font-variant-numeric:tabular-nums}
.free{font-size:14px;color:var(--muted);margin:4px 0 0 0;padding-left:18px}
.anim{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.anim{animation:none}.bar i{transition:none}}
@media(max-width:600px){.hint{display:none}}
</style>
</head>
<body>
<div class="bar"><i id="prog"></i></div>
<main id="app" aria-live="polite"></main>
<footer><div class="nav">
<button class="btn hide" id="back" type="button">Atrás</button>
<span class="hint" id="hint">Usa las letras o Enter</span>
<button class="btn go" id="next" type="button">Comenzar</button>
</div></footer>
<script>
{
const Q={
 q1:{t:'¿Cuál de estas frases describe mejor tu situación con el reto?',type:'one',
  o:[['No sabía que existía el reto','q2a'],['Lo vi, pero no lo empecé','q2a'],['Lo empecé y lo dejé','q2b'],['Lo terminé o voy al día','q4']]},
 q2a:{t:'¿Por qué no lo empezaste?',type:'many',max:2,other:true,next:'q4',
  o:['No tuve tiempo esa semana','No entendí bien qué tenía que hacer ni por dónde empezar','Me pareció muy largo o exigente','No me interesa ser afiliado; entré por otra razón','Siento que aún no tengo el nivel para hacerlo','No encontré dónde estaba dentro de la comunidad']},
 q2b:{t:'¿Hasta dónde llegaste?',type:'one',next:'q3b',
  o:['Solo vi la introducción','Hice 1 o 2 tareas','Pasé la mitad','Me faltó poco para terminar']},
 q3b:{t:'¿Qué te hizo parar?',type:'many',max:2,other:true,next:'q4',
  o:['Me atasqué en una tarea y no supe cómo seguir','Una herramienta o paso técnico me frenó','Se me cruzaron otras prioridades y perdí el ritmo','No veía resultados y perdí la motivación','Las tareas tomaban más tiempo del que esperaba','No tenía a quién preguntarle o no quise preguntar en público']},
 q4:{t:'¿Para qué entraste a IAdopters?',type:'one',other:true,next:'q5',
  o:['Empezar a ganar dinero como afiliado','Aprender a usar IA en mi negocio o trabajo','Obtener sistemas o herramientas listas para usar','Estar en contacto con otras personas que usan IA','Solo quería ver qué había dentro']},
 q5:{t:'¿Cuánto tiempo real tienes a la semana para la comunidad?',type:'one',next:'q6',
  o:['Menos de 1 hora','1 a 3 horas','3 a 5 horas','Más de 5 horas']},
 q6:{t:'¿Qué te ayudaría a avanzar?',type:'many',max:2,next:'q7',
  o:['Tareas más cortas, de 15 minutos o menos','Un video o ejemplo de alguien haciendo cada paso','Una sesión en vivo para hacerlo juntos','Un recordatorio o seguimiento por DM','Un compañero de reto o un grupo pequeño','Poder preguntar en privado','Nada; el reto está bien y el problema es mi tiempo']},
 q7:{t:'¿En qué plan estás?',type:'one',next:'q8',o:['Estándar','Premium','No sé']},
 q8:{t:'Tu nombre en Skool',type:'text',next:'end',help:'Opcional. Déjalo si quieres que te contactemos para ayudarte a retomar el reto.'}
};
const ORDER=['q1','q2a','q2b','q3b','q4','q5','q6','q7','q8'];
// ===== CONFIGURA AQUÍ TU PROYECTO DE SUPABASE =====
const SUPABASE_URL='https://mfteylzbjlqwpbzibgfb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_mVTwcVRy2uSptJDYeBjDlA__XaNKTjt'; // sb_publishable_... (o la anon antigua eyJ...)
// ===================================================
const OTHER='Otro';
const $=id=>document.getElementById(id);
const app=$('app'),nextB=$('next'),backB=$('back'),prog=$('prog'),hint=$('hint');
let cur='intro',hist=[],ans={},db=null,user=null,uid=null,owner=false,saved=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=i=>String.fromCharCode(65+i);
const opts=q=>{const o=q.o.map(x=>Array.isArray(x)?x[0]:x);return q.other?o.concat(OTHER):o};

function stepsLeft(id){ // ruta más probable para la barra de avance
  const v=ans.q1?ans.q1.v:null;
  const path=v==null?['q1','q2b','q3b','q4','q5','q6','q7','q8']:
    v===0||v===1?['q1','q2a','q4','q5','q6','q7','q8']:v===2?['q1','q2b','q3b','q4','q5','q6','q7','q8']:['q1','q4','q5','q6','q7','q8'];
  const i=path.indexOf(id);return{i:i<0?0:i,n:path.length}
}
function valid(id){
  const q=Q[id],a=ans[id];
  if(q.type==='text')return true;
  if(q.type==='one'){if(a==null)return false;return !(q.other&&opts(q)[a.v]===OTHER&&!(a.txt||'').trim())}
  if(!a||!a.v.length)return false;
  const oi=opts(q).indexOf(OTHER);return !(q.other&&a.v.includes(oi)&&!(a.txt||'').trim())
}
function render(){
  backB.classList.toggle('hide',cur==='intro'||cur==='end'||cur==='results');
  hint.style.visibility=Q[cur]?'visible':'hidden';
  if(cur==='intro')return intro();
  if(cur==='end')return end();
  if(cur==='results')return results();
  const q=Q[cur],{i,n}=stepsLeft(cur);
  prog.style.width=(i/n*100)+'%';
  const a=ans[cur];
  let body='';
  if(q.type==='text'){
    body=`<input type="text" id="txt" maxlength="80" placeholder="Ej.: Laura Gómez" value="${esc(a||'')}" autocomplete="name">`;
  }else{
    const os=opts(q),sel=q.type==='one'?(a?[a.v]:[]):(a?a.v:[]);
    const full=q.type==='many'&&sel.length>=q.max;
    body=`<div class="opts" role="group">${os.map((o,k)=>{const on=sel.includes(k);
      return `<button type="button" class="opt" data-k="${k}" aria-pressed="${on}" ${full&&!on?'disabled':''}><kbd>${L(k)}</kbd><span>${esc(o)}</span></button>`}).join('')}</div>
      ${q.other?`<div class="other ${sel.includes(os.length-1)?'on':''}"><input type="text" id="oth" maxlength="140" placeholder="Cuéntanos en pocas palabras" value="${esc(a&&a.txt||'')}"></div>`:''}`;
  }
  const help=q.help||(q.type==='many'?`Elige hasta ${q.max}.`:q.type==='one'?'Elige una opción.':'');
  app.innerHTML=`<section class="anim"><p class="step">Pregunta ${i+1} de ${n}</p><h2>${esc(q.t)}</h2><p class="help">${esc(help)}</p>${body}<p class="note" id="note"></p></section>`;
  nextB.textContent=cur==='q8'?'Enviar':'Continuar';
  nextB.disabled=!valid(cur);
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.k)));
  const oth=$('oth');if(oth)oth.addEventListener('input',e=>{ans[cur].txt=e.target.value;nextB.disabled=!valid(cur)});
  const tx=$('txt');if(tx){tx.addEventListener('input',e=>{ans[cur]=e.target.value});tx.focus()}
}
function pick(k){
  const q=Q[cur],os=opts(q);if(k>=os.length)return;
  if(q.type==='one'){
    const txt=ans[cur]&&ans[cur].txt;ans[cur]={v:k,txt};render();
    if(os[k]===OTHER){const o=$('oth');o&&o.focus();return}
    setTimeout(()=>{if(valid(cur))go()},260);return;
  }
  const a=ans[cur]||(ans[cur]={v:[],txt:''});
  const i=a.v.indexOf(k);
  if(i>=0)a.v.splice(i,1);else if(a.v.length<q.max)a.v.push(k);
  else{$('note').textContent=`Ya elegiste ${q.max}. Quita una para cambiarla.`;return}
  render();
  if(os[k]===OTHER&&a.v.includes(k)){const o=$('oth');o&&o.focus()}
}
function nextOf(id){
  const q=Q[id];
  if(id==='q1')return q.o[ans.q1.v][1];
  return q.next;
}
function go(){
  if(cur==='intro'){hist=[];cur='q1';return render()}
  if(!Q[cur]||!valid(cur))return;
  const n=nextOf(cur);hist.push(cur);
  if(n==='end'){submit();return}
  cur=n;render();window.scrollTo(0,0);
}
function back(){if(!hist.length)return;cur=hist.pop();render()}
function clean(){ // borra respuestas de ramas que ya no aplican
  const path=[];let id='q1';while(id&&id!=='end'){path.push(id);if(!valid(id))break;id=nextOf(id)}
  const out={};path.forEach(p=>{if(ans[p]!=null)out[p]=ans[p]});return out
}
function label(id,a){
  const q=Q[id];if(q.type==='text')return a||'';
  const os=opts(q),vs=q.type==='one'?[a.v]:a.v;
  return vs.map(v=>os[v]===OTHER?`Otro: ${a.txt||''}`:os[v]).join(' | ')
}
function asText(){
  const c=clean();
  return 'Encuesta reto Máquina de Afiliado\n'+Object.keys(c).map(id=>`• ${Q[id].t}\n  ${label(id,c[id])||'(sin respuesta)'}`).join('\n')
}
async function submit(){
  cur='end';prog.style.width='100%';
  app.innerHTML='<section class="anim"><h2>Enviando…</h2></section>';
  nextB.style.visibility='hidden';backB.classList.add('hide');hint.style.visibility='hidden';
  saved=false;
  const c=clean(),row={raw:c};
  ORDER.forEach(id=>{row[id]=c[id]!=null?label(id,c[id]):null});
  if(!row.q8)row.q8=null;
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/respuestas_reto',{method:'POST',
      headers:Object.assign({'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        SUPABASE_ANON_KEY.startsWith('eyJ')?{'Authorization':'Bearer '+SUPABASE_ANON_KEY}:{}),
      body:JSON.stringify(row)});
    saved=r.ok;
  }catch(e){saved=false}
  render();
}
function intro(){
  prog.style.width='0';nextB.style.visibility='visible';nextB.disabled=false;nextB.textContent='Comenzar';
  app.innerHTML=`<section class="anim"><p class="step">IAdopters · 2 minutos</p>
  <h1>¿Qué pasó con el reto Máquina de Afiliado?</h1>
  <p class="help">No hay respuestas correctas. Lo que nos digas lo usamos para ajustar el reto y hacerlo más fácil de completar.</p>
  ${owner?`<button class="btn" type="button" id="seeRes">Ver respuestas recibidas</button>`:''}</section>`;
  const s=$('seeRes');if(s)s.addEventListener('click',()=>{cur='results';render()});
}
function end(){
  nextB.style.visibility='hidden';
  const txt=asText();
  app.innerHTML=saved?`<section class="anim"><p class="step">Listo</p><h2>Gracias, recibimos tus respuestas.</h2>
    <p class="help">Con esto vamos a ajustar el reto. Si dejaste tu nombre, te escribimos por Skool.</p></section>`
  :`<section class="anim"><p class="step">Último paso</p><h2>Copia tus respuestas y envíalas por DM en Skool.</h2>
    <p class="help">Desde aquí no pudimos guardarlas automáticamente. Copia el texto y pégalo en un mensaje directo a Rodolfo en Skool.</p>
    <div class="card"><pre id="sum">${esc(txt)}</pre></div>
    <p style="margin-top:14px"><button class="btn go" type="button" id="cp">Copiar respuestas</button> <span class="note" id="cpn"></span></p></section>`;
  const cp=$('cp');if(cp)cp.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(txt);$('cpn').textContent='Copiado. Ahora pégalo en Skool.'}
    catch(e){const r=document.createRange();r.selectNodeContents($('sum'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('cpn').textContent='Selecciónalo y cópialo manualmente.'}
  });
}
async function results(){
  nextB.style.visibility='hidden';backB.classList.remove('hide');prog.style.width='0';
  app.innerHTML='<section><h2>Cargando respuestas…</h2></section>';
  let rows=[];
  try{const r=await db.collection('respuestas').get();const d=r&&r.docs?r.docs:(Array.isArray(r)?r:[]);rows=d.map(x=>typeof x.data==='function'?x.data():(x.data||x))}
  catch(e){app.innerHTML='<section><h2>No se pudieron leer las respuestas.</h2></section>';return}
  if(!rows.length){app.innerHTML='<section class="anim"><h2>Aún no hay respuestas.</h2><p class="help">Cuando alguien envíe la encuesta desde esta página, verás aquí el conteo por pregunta.</p></section>';return}
  const blocks=ORDER.filter(id=>Q[id].type!=='text').map(id=>{
    const q=Q[id],os=opts(q),cnt=os.map(()=>0),free=[];let n=0;
    rows.forEach(r=>{const a=r[id];if(a==null)return;n++;const vs=q.type==='one'?[a.v]:(a.v||[]);vs.forEach(v=>{if(cnt[v]!=null)cnt[v]++});if(a.txt&&a.txt.trim())free.push(a.txt.trim())});
    if(!n)return '';
    return `<h3>${esc(q.t)} <span class="note">(${n})</span></h3>${os.map((o,k)=>`<div class="row"><span>${esc(o)}</span><b>${cnt[k]}</b><div class="track"><i style="width:${n?cnt[k]/n*100:0}%"></i></div></div>`).join('')}
      ${free.length?`<ul class="free">${free.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}`}).join('');
  const names=rows.map(r=>r.q8).filter(x=>x&&x.trim());
  const csv=['fecha,'+ORDER.join(',')].concat(rows.map(r=>[new Date(r.ts||0).toISOString().slice(0,10)].concat(ORDER.map(id=>r[id]==null?'':'"'+label(id,r[id]).replace(/"/g,'""')+'"')).join(','))).join('\n');
  app.innerHTML=`<section class="anim res"><p class="step">${rows.length} respuestas</p><h2>Resultados de la encuesta</h2>
  <p class="help">En las preguntas de selección múltiple, cada persona cuenta hasta 2 veces.</p>
  <button class="btn go" type="button" id="csv">Copiar en CSV</button> <span class="note" id="csvn"></span>
  ${blocks}${names.length?`<h3>Pidieron contacto</h3><ul class="free">${names.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</section>`;
  $('csv').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(csv);$('csvn').textContent='Copiado.'}catch(e){$('csvn').textContent='No se pudo copiar.'}});
}
nextB.addEventListener('click',go);
backB.addEventListener('click',()=>{if(cur==='results'){cur='intro';render()}else back()});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();go()}return}
  if(e.key==='Enter'){e.preventDefault();go();return}
  if(Q[cur]&&Q[cur].type!=='text'&&/^[a-hA-H]$/.test(e.key))pick(e.key.toUpperCase().charCodeAt(0)-65);
});
render();
}
</script>
</body>
</html>
